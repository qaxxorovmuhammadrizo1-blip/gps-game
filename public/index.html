<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Territory Control MMO</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #map { width: 100%; height: 100vh; }

    .header-panel {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(15, 15, 18, 0.9); backdrop-filter: blur(8px);
      border-radius: 14px; padding: 10px 14px; display: flex;
      justify-content: space-between; align-items: center; color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .bottom-panel { position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000; display: flex; gap: 10px; }
    .btn-action {
      flex: 1; background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff; border: none; padding: 15px; border-radius: 12px;
      font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-panel">
    <div>
      <div id="my-name" style="font-weight:bold; font-size:14px; color:#00f2fe;">O'yinchi</div>
      <div id="status" style="font-size:10px; color:#00ff88;">📡 Ulanmoqda...</div>
    </div>
    <div style="text-align:right;">
      <div id="meter-counter" style="font-size:16px; font-weight:bold; color:#00f2fe;">0 m</div>
      <div style="font-size:9px; color:#aaa;">MASOFA</div>
    </div>
  </div>

  <div id="map"></div>

  <div class="bottom-panel">
    <button class="btn-action" onclick="changeName()">✏️ Ismni o'zgartirish</button>
  </div>

  <script>
    const socket = io();

    // Ismni brauzerdan olish yoki o'rnatish
    let userName = localStorage.getItem('player_name');
    if (!userName) {
      userName = prompt("O'yindagi ismingizni kiriting:", "Sardor");
      if (!userName) userName = "O'yinchi_" + Math.floor(Math.random()*1000);
      localStorage.setItem('player_name', userName);
    }
    document.getElementById('my-name').innerText = userName;

    function changeName() {
      let newName = prompt("Yangi ismni kiriting:", userName);
      if (newName) {
        localStorage.setItem('player_name', newName);
        location.reload();
      }
    }

    const map = L.map('map', { zoomControl: false }).setView([40.6324, 72.3765], 18);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let playerMarker = null;
    let playerLine = null;
    let pathCoords = [];
    let totalDist = 0;

    socket.on('connect', () => {
      document.getElementById('status').innerText = "🟢 Onlayn";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          socket.emit('joinGame', {
            name: userName,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          });
        });
      }
    });

    socket.on('playerMoved', (data) => {
      if (data.id === socket.id) {
        document.getElementById('meter-counter').innerText = Math.round(data.distance) + " m";
      }
    });

    if (navigator.geolocation) {
      let lastCoord = null;
      navigator.geolocation.watchPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        let dist = 0;
        if (lastCoord) dist = map.distance(lastCoord, [lat, lng]);
        lastCoord = [lat, lng];
        
        map.panTo([lat, lng]);
        socket.emit('playerMove', { lat, lng, dist });
      }, null, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>

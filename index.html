<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Zone Game</title>
  
  <!-- Leaflet CSS (Xarita interfeysi) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
    
    .panel {
      position: absolute;
      bottom: 20px;
      left: 5%;
      right: 5%;
      background: rgba(20, 20, 20, 0.9);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }
    
    .btn {
      background: #2ea6ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
      width: 100%;
    }
    .status { font-size: 13px; color: #00ff88; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel">
    <div class="status" id="status">GPS qidirilmoqda...</div>
    <div id="info">Koordinata: --, --</div>
    <button class="btn" onclick="setZone()">🎯 Hozirgi joyda hudud belgilash</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Xaritaning boshlang'ich sozlamasi
    const map = L.map('map').setView([40.6324, 72.3765], 15);

    // OpenStreetMap qatlami
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let userMarker = null;
    let zoneCircle = null;
    let currentLat = null;
    let currentLng = null;

    // GPS lokatsiyani kuzatish
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;

          document.getElementById('status').innerText = "⚡ GPS Ulangan";
          document.getElementById('info').innerText = `Lat: ${currentLat.toFixed(5)}, Lng: ${currentLng.toFixed(5)}`;

          // O'yinchi belgisi (Marker)
          if (!userMarker) {
            userMarker = L.marker([currentLat, currentLng]).addTo(map).bindPopup("Siz shu yerdasiz!");
            map.setView([currentLat, currentLng], 17);
          } else {
            userMarker.setLatLng([currentLat, currentLng]);
          }
        },
        (err) => {
          document.getElementById('status').innerText = "⚠️ GPS ruxsati berilmadi";
        },
        { enableHighAccuracy: true }
      );
    }

    // Hudud (Zona) belgilash
    function setZone() {
      if (!currentLat || !currentLng) {
        alert("GPS koordinatasi hali aniqlanmadi!");
        return;
      }

      if (zoneCircle) map.removeLayer(zoneCircle);

      // 100 metrlik radiusdagi zona
      zoneCircle = L.circle([currentLat, currentLng], {
        color: '#ff3300',
        fillColor: '#ff6600',
        fillOpacity: 0.3,
        radius: 100
      }).addTo(map);

      map.fitBounds(zoneCircle.getBounds());
      alert("🎯 Sizning 100 metrlik o'yin hududingiz belgilandi!");
    }
  </script>
</body>
</html>
